name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Project 0.1.0, WordPress 6.7, WooCommerce 10.3 (or Python 3.12, Django 5.1)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Please remove keys, passwords and personal data first.
      render: text
